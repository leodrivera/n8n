name: Sync workflows branch with upstream/master

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to chain into auto-rebase-iam after sync (e.g., n8n@1.112.0). Leave empty to sync only.'
        required: false
        type: string
      patch_branch:
        description: 'Patch branch name to pass to auto-rebase-iam'
        required: false
        default: 'iam'
        type: string
      dry_run:
        description: 'Dry run (no push, no chain)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: sync-upstream-workflows
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/n8n-io/n8n.git
  WHITELIST: "auto-rebase-iam.yml publish-ghcr.yml trigger-rebase-on-release.yml sync-from-upstream.yml"

jobs:
  sync:
    name: Merge upstream/master and clean workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout workflows branch
        uses: actions/checkout@v6
        with:
          ref: workflows
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          gpg --list-secret-keys --keyid-format=long

      - name: Configure Git
        run: |
          git config user.name "Leonardo Rivera"
          git config user.email "leodrivera@gmail.com"
          git config user.signingkey "${{ secrets.GPG_SIGNING_KEY }}"
          git config commit.gpgsign true

      - name: Add upstream remote and fetch
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_URL}"
          git fetch upstream master --no-tags

      - name: Check divergence
        id: divergence
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          AHEAD=$(git rev-list --count upstream/master..HEAD)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "Behind upstream/master: ${BEHIND}"
          echo "Ahead of upstream/master: ${AHEAD}"
          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/master
        if: steps.divergence.outputs.needs_sync == 'true'
        id: merge
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set +e
          git merge upstream/master --no-edit
          MERGE_EXIT=$?
          set -e

          if [ $MERGE_EXIT -eq 0 ]; then
            echo "Merge clean."
            exit 0
          fi

          echo "Merge has conflicts. Attempting auto-resolution for .github/workflows/* ..."

          # Auto-resolve modify/delete and rename/delete conflicts in .github/workflows/
          # by deleting the file (fork policy: only whitelisted workflows are kept).
          CONFLICTED=$(git status --porcelain | awk '/^(DU|UD|AU|UA) / {print $2}')
          for f in $CONFLICTED; do
            if [[ "$f" == .github/workflows/* ]]; then
              echo "Resolving (delete) $f"
              git rm -f "$f"
            fi
          done

          # Any remaining conflicts must be handled by a human.
          REMAINING=$(git status --porcelain | grep -E "^(UU|AA|DU|UD|DD|AU|UA) " || true)
          if [ -n "$REMAINING" ]; then
            echo "::error::Unresolved conflicts remain outside .github/workflows/. Manual resolution required."
            echo "$REMAINING"

            if [ "$DRY_RUN" = "true" ]; then
              git merge --abort
              exit 1
            fi

            # Push conflicted merge state to a dedicated branch so a human can
            # resolve it via a draft PR instead of reconstructing the merge.
            CONFLICT_BRANCH="sync-conflict-${GITHUB_RUN_ID}"
            git checkout -b "$CONFLICT_BRANCH"
            git add -A
            git commit -m "WIP: merge upstream/master with unresolved conflicts"
            git push origin "$CONFLICT_BRANCH"
            {
              echo "conflict_branch=${CONFLICT_BRANCH}"
              echo "conflicted_files<<EOF"
              echo "$REMAINING"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git commit --no-edit -m "Merge upstream/master into workflows (auto-resolved workflow conflicts)"

      - name: Open draft PR for manual conflict resolution
        if: failure() && steps.merge.outputs.conflict_branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICT_BRANCH: ${{ steps.merge.outputs.conflict_branch }}
          CONFLICTED_FILES: ${{ steps.merge.outputs.conflicted_files }}
        run: |
          # GITHUB_REPOSITORY is always the repo this workflow runs in (the fork).
          # Head branch has no owner prefix, so it resolves inside this repo only,
          # and GITHUB_TOKEN has no permissions on any other repo.
          BODY=$(printf 'Automated sync hit conflicts outside `.github/workflows/` (run %s).\n\nConflicted files:\n```\n%s\n```\n\nThe branch contains the merge state **with conflict markers**. Resolve locally:\n\n```bash\ngit fetch origin %s\ngit checkout %s\n# resolve conflict markers, then:\ngit add -A\ngit commit --amend --no-edit\ngit push --force-with-lease origin %s\n```\n\nThen mark this PR ready for review and merge it into `workflows` (merge commit, not squash).' \
            "${GITHUB_RUN_ID}" "${CONFLICTED_FILES}" "${CONFLICT_BRANCH}" "${CONFLICT_BRANCH}" "${CONFLICT_BRANCH}")
          gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="Sync conflict: upstream/master into workflows (manual resolution required)" \
            -f head="${CONFLICT_BRANCH}" \
            -f base="workflows" \
            -F draft=true \
            -f body="$BODY"

      - name: Remove non-whitelisted workflows
        if: steps.divergence.outputs.needs_sync == 'true'
        id: cleanup
        run: |
          cd .github/workflows
          REMOVED=0
          for f in *.yml; do
            keep=false
            for w in $WHITELIST; do
              if [ "$f" = "$w" ]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = "false" ]; then
              echo "Removing non-whitelisted workflow: $f"
              git rm -f "$f"
              REMOVED=$((REMOVED+1))
            fi
          done
          echo "removed=${REMOVED}" >> "$GITHUB_OUTPUT"

      - name: Commit cleanup
        if: steps.divergence.outputs.needs_sync == 'true' && steps.cleanup.outputs.removed != '0'
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit for cleanup."
          else
            git commit -m "chore: Remove upstream workflows not in fork whitelist"
          fi

      - name: Push to origin/workflows
        if: steps.divergence.outputs.needs_sync == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git push origin workflows

      - name: Chain auto-rebase-iam when release_tag provided
        if: github.event.inputs.release_tag != '' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const releaseTag = '${{ github.event.inputs.release_tag }}';
            const patchBranch = '${{ github.event.inputs.patch_branch }}' || 'iam';
            console.log(`Dispatching auto-rebase-iam.yml with release_tag=${releaseTag} patch_branch=${patchBranch}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-rebase-iam.yml',
              ref: 'workflows',
              inputs: {
                release_tag: releaseTag,
                patch_branch: patchBranch,
              },
              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });

      - name: Summary
        run: |
          echo "Behind before sync: ${{ steps.divergence.outputs.behind }}"
          echo "Ahead before sync:  ${{ steps.divergence.outputs.ahead }}"
          echo "Workflows removed:  ${{ steps.cleanup.outputs.removed || 0 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run: no push performed."
          fi
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "Chained auto-rebase-iam for tag: ${{ github.event.inputs.release_tag }}"
          fi
