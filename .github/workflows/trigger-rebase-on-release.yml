name: Trigger rebase on n8n release

on:
  # Run on a schedule to check for new releases
  schedule:
    - cron: '0 0 * * *'  # Check once daily at midnight UTC
  
  # Also allow manual triggering
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific release tag to trigger rebase for (optional)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

env:
  UPSTREAM_REPO: "n8n-io/n8n"

jobs:
  check-for-new-release:
    name: Check for new n8n release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get latest release from upstream
        id: latest-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            # Use manually specified tag
            LATEST_TAG="${{ github.event.inputs.release_tag }}"
            echo "Using manually specified tag: $LATEST_TAG"
          else
            # Fetch latest release from upstream via authenticated gh CLI
            echo "Fetching latest release from ${{ env.UPSTREAM_REPO }}..."
            LATEST_TAG=$(gh release view --repo "${{ env.UPSTREAM_REPO }}" --json tagName -q '.tagName')
            if [ -z "$LATEST_TAG" ]; then
              echo "ERROR: Could not fetch latest release tag"
              exit 1
            fi
            echo "Latest release tag: $LATEST_TAG"
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if we already processed this release
        id: check-processed
        run: |
          TAG="${{ steps.latest-release.outputs.tag }}"
          CUSTOM_TAG="${TAG}-iam"
          
          # Check if the custom tag already exists in our repository
          if git ls-remote --tags origin | grep -q "refs/tags/${CUSTOM_TAG}$"; then
            echo "Release $TAG already processed (tag $CUSTOM_TAG exists)"
            echo "processed=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG not yet processed"
            echo "processed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger sync-from-upstream (chains into auto-rebase-iam)
        if: steps.check-processed.outputs.processed == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const releaseTag = '${{ steps.latest-release.outputs.tag }}';

            console.log(`Triggering sync-from-upstream for release: ${releaseTag}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-from-upstream.yml',
              ref: 'workflows',
              inputs: {
                release_tag: releaseTag,
                patch_branch: 'iam',
                dry_run: 'false'
              },
              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },
            });

            console.log('Sync workflow triggered. It will chain into auto-rebase-iam on completion.');

      - name: Summary
        run: |
          if [ "${{ steps.check-processed.outputs.processed }}" = "true" ]; then
            echo "Release ${{ steps.latest-release.outputs.tag }} already processed"
          else
            echo "Triggered sync-from-upstream for release: ${{ steps.latest-release.outputs.tag }}"
            echo "Chain: sync-from-upstream -> auto-rebase-iam"
          fi
