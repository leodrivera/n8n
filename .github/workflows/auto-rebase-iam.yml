name: Create release branch from n8n upstream tag

on:
  # Trigger when a new release is published to n8n-io/n8n
  repository_dispatch:
    types: [n8n-release]
  
  # Also trigger on workflow_dispatch for manual testing
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'n8n release tag to rebase onto (e.g., n8n@1.109.2)'
        required: true
        type: string
      patch_branch:
        description: 'Patch branch name to rebase'
        required: false
        default: 'iam'
        type: string
      strategy:
        description: 'Conflict resolution strategy'
        required: false
        default: 'theirs'
        type: choice
        options:
          - theirs
          - ours
          - manual

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "n8n-io/n8n"
  UPSTREAM_URL: "https://github.com/n8n-io/n8n.git"

jobs:
  auto-rebase:
    name: Create release/<version> branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository (workflows branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: workflows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          gpg --list-secret-keys --keyid-format=long

      - name: Configure Git
        run: |
          git config user.name "Leonardo Rivera"
          git config user.email "leodrivera@gmail.com"
          # Configure GPG signing for the bot
          git config user.signingkey ${{ secrets.GPG_SIGNING_KEY }}
          git config commit.gpgsign true
          git config tag.gpgsign true

      - name: Set up upstream remote
        run: |
          # Remove existing upstream if it exists
          git remote remove upstream 2>/dev/null || true
          # Add upstream remote
          git remote add upstream ${{ env.UPSTREAM_URL }}
          # Fetch all tags from upstream
          git fetch upstream --tags

      - name: Determine parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.release_tag }}"
            STRATEGY="${{ github.event.inputs.strategy }}"
          else
            RAW_TAG=$(echo '${{ github.event.client_payload.release_tag }}' | tr -d '"')
            STRATEGY="theirs"
          fi

          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "strategy=${STRATEGY}" >> $GITHUB_OUTPUT

          VERSION="${RAW_TAG#*@}"
          echo "release_branch=release/${VERSION}-iam" >> $GITHUB_OUTPUT
          echo "custom_tag=${RAW_TAG}-iam" >> $GITHUB_OUTPUT

      - name: Run release update script
        run: |
          # Build the command based on parameters
          CMD="python3 release_update.py"
          
          # Add target tag
          CMD="$CMD --to-tag ${{ steps.params.outputs.tag }}"
          
          # Add strategy
          CMD="$CMD --strategy ${{ steps.params.outputs.strategy }}"
          
          echo "Running: $CMD"
          echo "Strategy: ${{ steps.params.outputs.strategy }}"
          
          # Execute the command
          eval $CMD
          
          # Export release branch for later steps
          echo "release_branch=${{ steps.params.outputs.release_branch }}" >> $GITHUB_ENV
          echo "custom_tag=${{ steps.params.outputs.custom_tag }}" >> $GITHUB_ENV

      - name: Push release branch and tag
        run: |
          echo "Pushing branch ${{ env.release_branch }} and tag ${{ env.custom_tag }}"
          git push -u origin ${{ env.release_branch }}
          git push origin ${{ env.custom_tag }}

      - name: Trigger GHCR publish workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Wait briefly to ensure the tag is visible to the API
            await new Promise((r) => setTimeout(r, 10_000));
            const imageTag = process.env.custom_tag || '${{ env.custom_tag }}';
            if (!imageTag) {
              core.setFailed('custom_tag env var not found');
              return;
            }
            console.log(`Dispatching repository_dispatch with image_tag: ${imageTag}`);
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'n8n-iam-tag-created',
              client_payload: { image_tag: imageTag }
            });


      - name: Summary
        run: |
          echo "✅ Created branch ${{ env.release_branch }} from ${{ steps.params.outputs.tag }}"
          echo "✅ Created tag: ${{ env.custom_tag }}"
          echo "✅ Pushed branch and tag to origin"
          echo ""
          echo "Strategy used: ${{ steps.params.outputs.strategy }}"
          echo "New base tag: ${{ steps.params.outputs.tag }}"
          echo "Release branch: ${{ env.release_branch }}"
          echo "Custom tag: ${{ env.custom_tag }}"
